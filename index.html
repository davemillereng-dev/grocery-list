<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24323f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home">
<title>Family Hub</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1d232a;--muted:#78828c;--line:#e2e5e9;--head:#24323f;
  --shop:#2e7d32;--shop2:#e8f3e9;--cal:#1f5f99;--cal2:#e6eef7;--kit:#9a5412;--kit2:#f6ebdf}
@media (prefers-color-scheme:dark){:root{--bg:#121519;--card:#1b2026;--ink:#e7ebef;--muted:#8e98a2;--line:#2a3139;--head:#1b2733;
  --shop:#66bb6a;--shop2:#1f2e21;--cal:#5b9bd5;--cal2:#1c2a38;--kit:#e08a3c;--kit2:#33261a}}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);min-height:100vh}
header{background:var(--head);color:#fff;padding:calc(22px + env(safe-area-inset-top)) 20px 26px}
header .in{max-width:560px;margin:0 auto}
header h1{margin:0;font-size:24px}
header p{margin:4px 0 0;opacity:.75;font-size:15px}
main{max-width:560px;margin:-14px auto 0;padding:0 16px 40px;display:grid;gap:12px}
a.tile{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:16px;padding:18px 18px;text-decoration:none;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.05);min-height:96px}
a.tile:active{transform:scale(.99)}
.ico{flex:none;width:58px;height:58px;border-radius:14px;background:var(--c2);display:grid;place-items:center;font-size:30px}
.t{flex:1;min-width:0}
.t b{display:block;font-size:20px}
.t span{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.t .live{color:var(--c);font-weight:600}
.chev{color:var(--muted);font-size:24px}
.shop{--c:var(--shop);--c2:var(--shop2)}
.cal{--c:var(--cal);--c2:var(--cal2)}
.kit{--c:var(--kit);--c2:var(--kit2)}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:6px}
.update{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);z-index:25;background:var(--cal);color:#fff;border:0;border-radius:20px;padding:10px 18px;font:600 14px system-ui,sans-serif;box-shadow:0 3px 10px rgba(0,0,0,.25);cursor:pointer}
</style>
</head>
<body>
<header><div class="in">
  <h1 id="greet">Kia ora 👋</h1>
  <p id="date"></p>
</div></header>
<main>
  <a class="tile shop" href="shopping.html">
    <div class="ico">🛒</div>
    <div class="t"><b>Shopping list</b><span id="shopInfo">Add things and shop together</span></div>
    <div class="chev">›</div>
  </a>
  <a class="tile cal" href="calendar.html">
    <div class="ico">📅</div>
    <div class="t"><b>Family planner</b><span id="calInfo">Today, this week and what needs attention</span></div>
    <div class="chev">›</div>
  </a>
  <a class="tile kit" href="roster.html">
    <div class="ico">🍽️</div>
    <div class="t"><b>Kitchen roster</b><span id="kitInfo">Who's cooking, washing, drying and clearing</span></div>
    <div class="chev">›</div>
  </a>
  <p class="foot" id="foot"></p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNbFZRvipyDzV03dms_oDo7kCsDmOoXZY",
  authDomain: "super-list-55399.firebaseapp.com",
  projectId: "super-list-55399",
  storageBucket: "super-list-55399.firebasestorage.app",
  messagingSenderId: "147336745555",
  appId: "1:147336745555:web:e2fde89202a616ca702ca6"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const now = new Date();
const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
const todayIdx = (now.getDay() + 6) % 7;
const fam = doc(db, "households", "family");

$("#date").textContent = now.toLocaleDateString("en-NZ", { weekday: "long", day: "numeric", month: "long" });
const hr = now.getHours();

// The tiles always work; if this phone is already signed in, show a little live info too.
onAuthStateChanged(auth, user => {
  if (!user || user.isAnonymous){ $("#foot").textContent = "You'll be asked to sign in when you open one."; return; }
  const first = (user.displayName || user.email || "").split(/[ @]/)[0];
  $("#greet").textContent = `${hr < 12 ? "Morning" : hr < 18 ? "Afternoon" : "Evening"}, ${first} 👋`;
  const quiet = () => {};
  onSnapshot(collection(fam, "items"), snap => {
    const n = snap.docs.filter(d => !d.data().ticked).length;
    $("#shopInfo").innerHTML = n ? `<span class="live">${n} thing${n > 1 ? "s" : ""} to get</span>` : "The list is empty";
  }, quiet);
  onSnapshot(doc(fam, "roster", "w-" + ymd(monday)), snap => {
    const t = snap.data()?.days?.[todayIdx];
    if (!t || !(t.wash || t.dry || t.table)){ $("#kitInfo").textContent = "Tonight's jobs aren't set yet"; return; }
    const bits = [t.cook ? `${t.cook} cooks & washes` : t.wash && `${t.wash} washes`, t.dry && `${t.dry} dries`, t.table && `${t.table} clears`].filter(Boolean);
    $("#kitInfo").innerHTML = `<span class="live">Tonight: ${esc(bits.join(" · "))}</span>`;
  }, quiet);
});
</script>
<script>
/* Update check – if the website has a newer version than the copy on this phone, offer a one-tap update.
   When you change this file, change APP_VERSION too (any new text will do). */
(function () {
  const APP_VERSION = "2026-10-16c";
  let shown = false;
  async function check() {
    if (shown || !navigator.onLine || location.protocol === "file:") return;
    try {
      const r = await fetch(location.pathname + "?vcheck=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      const m = (await r.text()).match(/APP_VERSION = "([^"]+)"/);
      if (m && m[1] !== APP_VERSION) {
        shown = true;
        const b = document.createElement("button");
        b.className = "update";
        b.textContent = "New version available – tap to update";
        b.onclick = () => location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]));
        document.body.appendChild(b);
      }
    } catch (e) {}
  }
  check();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
  setInterval(check, 30 * 60 * 1000);
})();
</script>
</body>
</html>
